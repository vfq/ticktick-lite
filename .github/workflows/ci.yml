name: CI

# 只跑可跨平台部分。app / plugin 依赖 Windows 专属 API，
# 在 Linux runner 上编译通过是假信号，见 docs/adr/ADR-0002-ci-self-hosted-qc.md。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 该机 3.6G 内存，全并行 codegen 容易 OOM（rustc 被 SIGKILL）
  CARGO_BUILD_JOBS: "2"
  # 官方源在该机实测约 32KB/s，装工具链必须走中科大镜像
  RUSTUP_DIST_SERVER: https://mirrors.ustc.edu.cn/rust-static
  RUSTUP_UPDATE_ROOT: https://mirrors.ustc.edu.cn/rust-static/rustup

jobs:
  fmt:
    name: fmt
    runs-on: [self-hosted, qc]
    # checkout 自管重试最坏约 7 分钟（6 次 fetch + 15s 递增退避），预算须大于它
    timeout-minutes: 15
    # 公开仓库 + self-hosted：拒绝 fork PR，否则任何人都能在 runner 主机上执行任意代码
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        # actions/checkout 内置 3 次短重试，扛不住该机到 github.com 的间歇性
        # GnuTLS / HTTP2 中断（实测同一分钟内连续失败、随后一次即成功）。
        # 改为自管重试：最多 6 次，线性退避。做法与同机 dqqxfw 仓库一致。
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name target -exec rm -rf {} +
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 该机到 github.com 的连接会**挂住**（不断开也不传数据），
          # 单纯重试无效：必须给传输设低速阈值，让 git 自己中断后重试。
          GIT=(git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=25)
          for i in 1 2 3 4 5 6; do
            if "${GIT[@]}" fetch --depth=1 --no-tags origin "$GITHUB_SHA" \
               || "${GIT[@]}" fetch --depth=1 --no-tags origin "$GITHUB_REF"; then
              git checkout -q FETCH_HEAD
              echo "checkout ok (attempt $i)"
              exit 0
            fi
            echo "checkout attempt $i failed; retry in $((i*10))s"
            sleep $((i*10))
          done
          echo "checkout failed after 6 attempts" >&2
          exit 1
      - name: Setup Rust
        # 该机已预装 rustup，但 runner 服务的 PATH 不含 ~/.cargo/bin，必须每轮显式补。
        # rust-toolchain.toml 锁定 1.100，rustup 会按需安装（走顶层的 USTC 镜像）。
        run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (core)
    runs-on: [self-hosted, qc]
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      # 按 job 隔离 target 目录，避免同机多个 cargo 抢同一目录互锁 .o 文件
      CARGO_TARGET_DIR: /var/cache/ticktick/target-clippy
    steps:
      - name: Checkout
        # actions/checkout 内置 3 次短重试，扛不住该机到 github.com 的间歇性
        # GnuTLS / HTTP2 中断（实测同一分钟内连续失败、随后一次即成功）。
        # 改为自管重试：最多 6 次，线性退避。做法与同机 dqqxfw 仓库一致。
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name target -exec rm -rf {} +
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 该机到 github.com 的连接会**挂住**（不断开也不传数据），
          # 单纯重试无效：必须给传输设低速阈值，让 git 自己中断后重试。
          GIT=(git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=25)
          for i in 1 2 3 4 5 6; do
            if "${GIT[@]}" fetch --depth=1 --no-tags origin "$GITHUB_SHA" \
               || "${GIT[@]}" fetch --depth=1 --no-tags origin "$GITHUB_REF"; then
              git checkout -q FETCH_HEAD
              echo "checkout ok (attempt $i)"
              exit 0
            fi
            echo "checkout attempt $i failed; retry in $((i*10))s"
            sleep $((i*10))
          done
          echo "checkout failed after 6 attempts" >&2
          exit 1
      - name: Setup Rust
        # 该机已预装 rustup，但 runner 服务的 PATH 不含 ~/.cargo/bin，必须每轮显式补。
        # rust-toolchain.toml 锁定 1.100，rustup 会按需安装（走顶层的 USTC 镜像）。
        run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      - name: Install clippy
        run: rustup component add clippy
      - name: cargo clippy
        run: cargo clippy -p ticktick-core --all-targets --locked -- -D warnings

  test:
    name: test (core)
    runs-on: [self-hosted, qc]
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      CARGO_TARGET_DIR: /var/cache/ticktick/target-test
    steps:
      - name: Checkout
        # actions/checkout 内置 3 次短重试，扛不住该机到 github.com 的间歇性
        # GnuTLS / HTTP2 中断（实测同一分钟内连续失败、随后一次即成功）。
        # 改为自管重试：最多 6 次，线性退避。做法与同机 dqqxfw 仓库一致。
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name target -exec rm -rf {} +
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 该机到 github.com 的连接会**挂住**（不断开也不传数据），
          # 单纯重试无效：必须给传输设低速阈值，让 git 自己中断后重试。
          GIT=(git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=25)
          for i in 1 2 3 4 5 6; do
            if "${GIT[@]}" fetch --depth=1 --no-tags origin "$GITHUB_SHA" \
               || "${GIT[@]}" fetch --depth=1 --no-tags origin "$GITHUB_REF"; then
              git checkout -q FETCH_HEAD
              echo "checkout ok (attempt $i)"
              exit 0
            fi
            echo "checkout attempt $i failed; retry in $((i*10))s"
            sleep $((i*10))
          done
          echo "checkout failed after 6 attempts" >&2
          exit 1
      - name: Setup Rust
        # 该机已预装 rustup，但 runner 服务的 PATH 不含 ~/.cargo/bin，必须每轮显式补。
        # rust-toolchain.toml 锁定 1.100，rustup 会按需安装（走顶层的 USTC 镜像）。
        run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      - name: cargo test
        run: cargo test -p ticktick-core --locked

  docs:
    name: docs front matter
    runs-on: [self-hosted, qc]
    # 同样要给 checkout 重试留出约 7 分钟；run 45844244973 的此 job 就是被 5 分钟预算掐断的
    timeout-minutes: 12
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        # actions/checkout 内置 3 次短重试，扛不住该机到 github.com 的间歇性
        # GnuTLS / HTTP2 中断（实测同一分钟内连续失败、随后一次即成功）。
        # 改为自管重试：最多 6 次，线性退避。做法与同机 dqqxfw 仓库一致。
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name target -exec rm -rf {} +
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 该机到 github.com 的连接会**挂住**（不断开也不传数据），
          # 单纯重试无效：必须给传输设低速阈值，让 git 自己中断后重试。
          GIT=(git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=25)
          for i in 1 2 3 4 5 6; do
            if "${GIT[@]}" fetch --depth=1 --no-tags origin "$GITHUB_SHA" \
               || "${GIT[@]}" fetch --depth=1 --no-tags origin "$GITHUB_REF"; then
              git checkout -q FETCH_HEAD
              echo "checkout ok (attempt $i)"
              exit 0
            fi
            echo "checkout attempt $i failed; retry in $((i*10))s"
            sleep $((i*10))
          done
          echo "checkout failed after 6 attempts" >&2
          exit 1
      - name: Check docs front matter
        run: |
          set -e
          fail=0
          for f in $(git ls-files 'docs/*/*.md'); do
            head -1 "$f" | grep -q '^---$' || { echo "::error file=$f::首行必须是 ---（front matter）"; fail=1; }
            grep -q '^id: '      "$f" || { echo "::error file=$f::缺少 id"; fail=1; }
            grep -q '^status: '  "$f" || { echo "::error file=$f::缺少 status"; fail=1; }
            grep -q '^updated: ' "$f" || { echo "::error file=$f::缺少 updated"; fail=1; }
          done
          exit $fail

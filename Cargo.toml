[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "plugins/pomodoro"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ticktick-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.dev]
debug = 1
incremental = true
